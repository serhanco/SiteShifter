name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
        db: ['mariadb:10.11', 'mysql:8.0']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, mbstring
          coverage: none
      - run: composer install --no-progress
      - run: vendor/bin/phpunit --debug
        timeout-minutes: 8
        env:
          SS_DB_HOST: 127.0.0.1:3306
          SS_DB_USER: root
          SS_DB_PASS: root
      - run: php bin/build-installer.php
